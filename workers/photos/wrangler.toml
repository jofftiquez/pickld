# Photo Worker (D-12). Staging deploys from GitHub Actions (scripts/deploy/, docs/runbooks/staging.md), which also
# sets PHOTO_TOKEN_SECRET to the same value as the Supabase secret.
# Buckets are never public; this Worker is the only reader.
name = "pickld-photos"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false

# Staging answers on pickld-photos-staging.<account>.workers.dev: a custom domain needs the pickld.me zone on
# Cloudflare, and its DNS is still at GoDaddy (docs/runbooks/staging.md).
[env.staging]
name = "pickld-photos-staging"
workers_dev = true
r2_buckets = [{ binding = "PHOTOS", bucket_name = "pickld-photos-staging" }]

[env.production]
name = "pickld-photos"
routes = [{ pattern = "photos.pickld.me", custom_domain = true }]
r2_buckets = [{ binding = "PHOTOS", bucket_name = "pickld-photos-production" }]
