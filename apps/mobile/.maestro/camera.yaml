# M2-07: Capture tab → Camera (dev mock camera) → switch slot → shutter → Today shows the photo queued.
# Run on the iOS Simulator with a dev build (no camera there, so the mock preview is used), signed in as
# a user whose open jar has SLOT empty:
#   maestro test --test-output-dir docs/milestones/M2 apps/mobile/.maestro/camera.yaml
#   maestro test -e SLOT=ootd apps/mobile/.maestro/camera.yaml
appId: me.pickld.app
env:
  SLOT: selfie
---
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000

- tapOn:
    id: tab-capture
- extendedWaitUntil:
    visible:
      id: camera-mock-preview
    timeout: 10000

# The moment tabs scroll sideways; bring SLOT into view if the default slot is far from it.
- runFlow:
    when:
      notVisible:
        id: camera-slot-${SLOT}
    commands:
      - swipe:
          from:
            id: camera-slot-switcher
          direction: LEFT
- tapOn:
    id: camera-slot-${SLOT}
- assertVisible:
    id: camera-slot-tag
    text: '#${SLOT}, today at .*'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: Camera-ios

- tapOn:
    id: camera-shutter
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 10000
# Saved to the offline queue first: waiting (offline), uploading, or already checking.
- extendedWaitUntil:
    visible:
      id: tile-${SLOT}
      text: '#${SLOT}, .*(waiting for connection|uploading|checking).*'
    timeout: 15000
