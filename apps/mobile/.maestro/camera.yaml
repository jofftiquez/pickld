# M2-07, M2-12: Capture tab → Camera (dev mock camera) → switch slot → shutter → editor (caption) →
# Add to #slot → Today shows the photo queued.
# Run on the iOS Simulator with a dev build (no camera there, so the mock preview is used), signed in as
# a user whose open jar has SLOT empty:
#   maestro test --test-output-dir docs/milestones/M2 apps/mobile/.maestro/camera.yaml
#   maestro test -e SLOT=ootd apps/mobile/.maestro/camera.yaml
appId: me.pickld.app
---
# Default SLOT here, not in env: (a flow's env: overrides `maestro test -e` in Maestro 2.12).
- evalScript: "${output.slot = (typeof SLOT !== 'undefined' && SLOT) ? SLOT : 'selfie'}"
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000

- tapOn:
    id: tab-capture
- extendedWaitUntil:
    visible:
      id: camera-mock-preview
    timeout: 10000

# The moment tabs scroll sideways and start centred on the default slot; a tab cut off at the edge
# doesn't take taps. Swipe the strip back to the first slots, then forward if SLOT is further along.
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 2
    commands:
      - swipe:
          from:
            id: camera-slot-switcher
          direction: RIGHT
- runFlow:
    when:
      notVisible:
        id: camera-slot-${output.slot}
    commands:
      - repeat:
          times: 2
          commands:
            - swipe:
                from:
                  id: camera-slot-switcher
                direction: LEFT
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: camera-slot-${output.slot}
- assertVisible:
    id: camera-slot-tag
    text: '#${output.slot}, today at .*'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: Camera-ios

- tapOn:
    id: camera-shutter
# The editor opens on the queued photo (M2-12); the upload waits for Add to #slot.
- extendedWaitUntil:
    visible:
      id: editor-screen
    timeout: 10000
- tapOn:
    id: editor-caption
- inputText: Sinigang at the office pantry
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: Capture-with-caption-ios
# The save button sits below the caption and privacy switch on smaller screens.
- scrollUntilVisible:
    element:
      id: editor-save
    direction: DOWN
    timeout: 10000
- tapOn:
    id: editor-save
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 10000
# Saved to the offline queue first: waiting (offline), uploading, checking, or already live (fn:moderate
# auto-approves in the early version, D-22, so on the local stack it is often live by now).
- extendedWaitUntil:
    visible:
      id: tile-${output.slot}
      text: '#${output.slot}, .*(waiting for connection|uploading|checking|added).*'
    timeout: 15000
