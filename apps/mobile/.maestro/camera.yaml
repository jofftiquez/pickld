# M2-07, M2-12: Today tile → Camera (dev mock camera) on that slot → shutter → editor (caption) →
# Add to #slot → Today shows the photo queued.
# Run on the iOS Simulator with a dev build (no camera there, so the mock preview is used), signed in as
# a user whose open jar has SLOT empty:
#   maestro test --test-output-dir docs/milestones/M2 apps/mobile/.maestro/camera.yaml
#   maestro test -e SLOT=ootd apps/mobile/.maestro/camera.yaml
appId: me.pickld.app
---
# Default SLOT here, not in env: (a flow's env: overrides `maestro test -e` in Maestro 2.12).
- evalScript: "${output.slot = (typeof SLOT !== 'undefined' && SLOT) ? SLOT : 'selfie'}"
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000

# The camera opens from the slot's tile on Today (the Capture tab is hidden, D-52); the slot is fixed.
- scrollUntilVisible:
    element:
      id: tile-${output.slot}
    direction: DOWN
    timeout: 10000
- tapOn:
    id: tile-${output.slot}
- extendedWaitUntil:
    visible:
      id: camera-mock-preview
    timeout: 10000
- assertVisible:
    id: camera-slot-tag
    text: '#${output.slot}, today at .*'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: Camera-ios

- tapOn:
    id: camera-shutter
# The editor opens on the queued photo (M2-12); the upload waits for Add to #slot.
- extendedWaitUntil:
    visible:
      id: editor-screen
    timeout: 10000
# Next opens the details step: the caption and who can see it (D-103).
- tapOn:
    id: editor-next
- tapOn:
    id: editor-caption
- inputText: Sinigang at the office pantry
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: Capture-with-caption-ios
# Save is in the editor's top toolbar on the details step (D-59, D-103), always on screen.
- tapOn:
    id: editor-save
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 10000
# Saved to the offline queue first: waiting (offline), uploading, checking, or already live (fn:moderate
# auto-approves in the early version, D-22, so on the local stack it is often live by now).
- extendedWaitUntil:
    visible:
      id: tile-${output.slot}
      text: '#${output.slot}, .*(waiting for connection|uploading|checking|added).*'
    timeout: 15000
