# A line for the day (0175): the owner adds one on Today, edits one on a past day, and sees it on that day's Jar
# page. Needs the seed data (dale has today's jar and yesterday's published jar) and dale signed in:
# maestro test apps/mobile/.maestro/day-line.yaml
appId: com.teamops.apps.Pickld
---
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000
# A first-time guide tip may be up; it catches taps until it is closed.
- tapOn:
    id: guide-tip-ok
    optional: true
# Today: add a line.
- extendedWaitUntil:
    visible:
      id: day-line
    timeout: 20000
- takeScreenshot: DayLineAdd-ios
- tapOn:
    id: day-line
- inputText: Moved into the new flat
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: DayLineEditing-ios
- tapOn:
    id: day-line-save
- extendedWaitUntil:
    visible:
      id: day-line-text
      text: “Moved into the new flat”
    timeout: 15000
- takeScreenshot: DayLineToday-ios
# Yesterday's day page: add a line there too, then open its Jar page.
- tapOn:
    id: day-step-previous
- extendedWaitUntil:
    visible:
      id: past-day-screen
    timeout: 15000
- tapOn:
    id: day-line
- eraseText: 80
- inputText: Lola's 80th, the whole family came
- tapOn:
    id: day-line-save
- extendedWaitUntil:
    visible:
      id: day-line-text
      text: “Lola's 80th, the whole family came”
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: DayLinePastDay-ios
- tapOn:
    id: view-jar
- extendedWaitUntil:
    visible:
      id: jar-line
      text: “Lola's 80th, the whole family came”
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: DayLineJarPage-ios
