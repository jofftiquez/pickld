# M4-11 (FR-SOC-10): Share jar on dale's own Jar page opens the Share jar card (design: ShareCard): 9:16 card
# with author, date, the moments, last caption, logo and pickld.me/dale. A background swatch restyles it,
# Include captions (in the Options sheet) toggles the caption, Copy link copies, and Save image saves the
# rendered card to Photos. Only the owner shares a jar (D-83).
# Needs the seed data (dale's full, published jar from yesterday) and dale signed in:
# maestro test apps/mobile/.maestro/share-card.yaml
appId: me.pickld.app
---
- launchApp:
    permissions:
      photos: allow
- extendedWaitUntil:
    visible:
      id: tab-jars
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000
- openLink: pickld://jar/b0000000-0000-4000-8000-000000000102
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: jar-share
    timeout: 40000
- tapOn:
    id: jar-share
- extendedWaitUntil:
    visible:
      id: share-card
    timeout: 20000
# The card is one accessible image, so its contents are checked in the screenshot.
# Let the photos arrive before the screenshot.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ShareCard-ios
# A background swatch restyles the card.
- tapOn:
    id: share-bg-ink
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ShareCardInk-ios
# Include captions sits in the Options sheet.
- tapOn:
    id: share-options
- extendedWaitUntil:
    visible:
      id: share-captions
    timeout: 5000
- tapOn:
    id: share-captions
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ShareCardNoCaption-ios
- tapOn:
    id: share-captions
# Close the sheet by tapping the dimmed card above it.
- tapOn:
    point: 50%,25%
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: share-copy
- extendedWaitUntil:
    visible: Link copied
    timeout: 5000
- tapOn:
    id: share-save
- extendedWaitUntil:
    visible: Saved to Photos
    timeout: 15000
- tapOn:
    id: share-back
- extendedWaitUntil:
    visible:
      id: jar-share
    timeout: 10000
