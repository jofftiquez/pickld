# M2-26, D-55: My days → select a past day with gaps → screenshot (design: Calendar, selected-day card) →
# Fill this jar → that day's page (design: Day) → an empty tile → Camera on that day (dev mock camera) →
# shutter → editor → Add to #slot → back on the day page with the photo queued → Back → My days.
# Run on the iOS Simulator with a dev build, signed in as seed user dale (Asia/Manila). Dale's jar 3 days
# ago has whereami, morning, ootd and evening (Added later), a removed afternoon moment, and gaps:
#   maestro test --test-output-dir docs/milestones/M2 apps/mobile/.maestro/fill-past-day.yaml
# The first run fills #mebusywith; reset with `pnpm db:reset` to get the same screenshot again.
appId: me.pickld.app
---
# Three days ago in Manila (the seed's zone), as the calendar's testID: day-YYYY-MM-DD.
- evalScript: '${output.day = new Date(Date.now() + 8 * 3600000 - 3 * 86400000).toISOString().slice(0, 10)}'
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000
- tapOn:
    id: today-my-days
- assertVisible:
    id: my-days-calendar
# Early in the month, three days ago is in the previous month.
- runFlow:
    when:
      notVisible:
        id: day-${output.day}
    commands:
      - tapOn:
          id: my-days-previous
- tapOn:
    id: day-${output.day}
- extendedWaitUntil:
    visible:
      id: selected-day-card
    timeout: 10000
- assertVisible:
    id: selected-day-count
    text: '.* of 8 moments · 1 added later'
- assertVisible:
    id: selected-day-thumb-evening
- assertVisible:
    id: selected-day-missing
- scrollUntilVisible:
    element:
      id: fill-this-jar
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: MyDays-selected-day-ios

- tapOn:
    id: fill-this-jar
# The day page: that day's jar card and 8 tiles, Back instead of the greeting, no Now tile.
- extendedWaitUntil:
    visible:
      id: day-scroll
    timeout: 10000
- assertVisible:
    id: day-back
- assertNotVisible:
    id: today-my-days
- assertVisible:
    id: jar-card
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: Day-past-day-ios
# An empty tile opens the camera in Fill mode on that slot.
- tapOn:
    id: tile-mebusywith
- extendedWaitUntil:
    visible:
      id: camera-mock-preview
    timeout: 10000
# The tag names the day being filled instead of "today".
- assertVisible:
    id: camera-slot-tag
    text: '#.*, for .*'
- tapOn:
    id: camera-shutter
# The editor opens on the queued photo (M2-12); Add to #slot saves it and goes back.
- extendedWaitUntil:
    visible:
      id: editor-screen
    timeout: 10000
- tapOn:
    id: editor-next
- tapOn:
    id: editor-save
# Back on the day page, the photo holds its slot at once (queued, then uploaded).
- extendedWaitUntil:
    visible:
      id: day-scroll
    timeout: 10000
- assertNotVisible:
    text: '#mebusywith, empty'
- takeScreenshot: Day-filled-ios
# Back to My days, where the selected day's card counts it too.
- tapOn:
    id: day-back
- extendedWaitUntil:
    visible:
      id: my-days-calendar
    timeout: 10000
- takeScreenshot: MyDays-filled-day-ios
