# M2-26, D-55, D-153: My days → tap a past day with gaps → that day's page straight away (design: Day) →
# an empty tile → the gallery for that day (never the camera) → the editor → Add to #slot → back on the day
# page with the photo queued.
# Run on the iOS Simulator with a dev build, signed in as seed user dale (Asia/Manila). Dale's jar 3 days
# ago has whereami, morning, ootd and evening (Added later), a removed afternoon moment, and gaps:
#   maestro test apps/mobile/.maestro/fill-past-day.yaml
# Apple's picker and Photos can't be driven reliably, so the day page is reopened with the dev-only
# `?devPhoto=portrait` param: an empty tile takes that bundled 3:4 photo instead of opening the gallery, as
# the camera's `?devPhoto=` does (crop.yaml). The first run fills #mebusywith; reset with `pnpm db:reset` to
# get the same screenshot again.
appId: com.teamops.apps.Pickld
---
# Three days ago in Manila (the seed's zone), as the calendar's testID: day-YYYY-MM-DD.
- evalScript: '${output.day = new Date(Date.now() + 8 * 3600000 - 3 * 86400000).toISOString().slice(0, 10)}'
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000
- tapOn:
    id: today-my-days
- assertVisible:
    id: my-days-calendar
# Early in the month, three days ago is in the previous month.
- runFlow:
    when:
      notVisible:
        id: day-${output.day}
    commands:
      - tapOn:
          id: my-days-previous
- tapOn:
    id: day-${output.day}
# The day page opens at once, with no summary card: that day's jar card and 8 tiles, Back instead of the
# greeting, no Now tile.
- extendedWaitUntil:
    visible:
      id: day-scroll
    timeout: 10000
- assertNotVisible:
    id: selected-day-card
- assertVisible:
    id: day-back
- assertNotVisible:
    id: today-my-days
- assertVisible:
    id: jar-card
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: Day-past-day-ios

# Reopen the day with the dev photo standing in for the gallery.
- openLink: pickld://day/${output.day}?devPhoto=portrait
# iOS asks before opening a custom-scheme link.
- extendedWaitUntil:
    visible: Open
    timeout: 5000
    optional: true
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: tile-mebusywith
    timeout: 10000
# An empty tile takes a photo from the gallery for that day; the camera never opens.
- tapOn:
    id: tile-mebusywith
# The 3:4 photo goes straight to the editor (M2-12); Add to #slot saves it and goes back.
- extendedWaitUntil:
    visible:
      id: editor-screen
    timeout: 10000
- assertNotVisible:
    id: camera-shutter
- tapOn:
    id: editor-next
- tapOn:
    id: editor-save
# Back on the day page, the photo holds its slot at once (queued, then uploaded).
- extendedWaitUntil:
    visible:
      id: day-scroll
    timeout: 10000
- assertNotVisible:
    text: '#mebusywith, empty'
- takeScreenshot: Day-filled-ios
