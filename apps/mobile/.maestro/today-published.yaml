# M3-02: Today after publishing (design: TodayPublished; FR-PUB-04, FR-PUB-03) → screenshot → visibility menu
# → Only me → the Published pill says who sees the jar; tapping it again opens the menu.
# Run after publish-review.yaml (dale's jar published as Everyone).
#   maestro test --test-output-dir docs/milestones/M3 apps/mobile/.maestro/today-published.yaml
appId: com.teamops.apps.Pickld
---
- launchApp
- extendedWaitUntil:
    visible:
      id: today-published
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000
- assertVisible:
    id: today-published
    text: 'Published, Shared with everyone'
- assertVisible:
    id: today-published-line
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: TodayPublished-ios

- tapOn:
    id: today-published
- extendedWaitUntil:
    visible:
      id: jar-visibility
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: JarVisibility-ios
- tapOn:
    id: jar-visibility-only_me
- extendedWaitUntil:
    visible:
      id: today-published
      text: 'Published, Only you'
    timeout: 10000
- tapOn:
    id: today-published
- tapOn:
    id: jar-visibility-everyone
- extendedWaitUntil:
    visible:
      id: today-published
      text: 'Published, Shared with everyone'
    timeout: 10000
