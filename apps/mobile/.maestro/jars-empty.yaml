# M3-06: someone who reads nobody sees "Read a few friends' days" with Find people and Invite friends on the Jars
# tab, above their own jars (lola has one).
# Needs the seed data (lola reads nobody) and lola signed in:
# maestro test apps/mobile/.maestro/jars-empty.yaml
appId: me.pickld.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-jars
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000
- tapOn:
    id: tab-jars
- extendedWaitUntil:
    visible:
      id: feed-find-people-card
    timeout: 40000
- assertVisible: Read a few friends’ days
- assertVisible:
    id: feed-find-people
- assertVisible:
    id: feed-invite
- assertNotVisible:
    id: feed-authors
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: JarsEmpty-ios
