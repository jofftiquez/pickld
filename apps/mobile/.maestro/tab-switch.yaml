# M1-23, D-52: tap each main tab (Today | Moments | Jars) and check its screen title and selected state;
# My days opens from Today's calendar button.
# Run on the iOS Simulator: maestro test apps/mobile/.maestro/tab-switch.yaml
appId: me.pickld.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000
- assertVisible:
    id: screen-title
    text: Today
- takeScreenshot: Today-tabs

# Capture is not a tab (D-52); Today's tiles open the camera (camera.yaml).
- assertNotVisible:
    id: tab-capture

- tapOn:
    id: tab-moments
- assertVisible:
    id: screen-title
    text: Moments
- assertVisible:
    id: tab-moments
    selected: true
- takeScreenshot: Moments-tabs

- tapOn:
    id: tab-jars
- assertVisible:
    id: screen-title
    text: Jars
- assertVisible:
    id: tab-jars
    selected: true
- takeScreenshot: Jars-tabs

- tapOn:
    id: tab-today
- tapOn:
    id: today-my-days
- assertVisible:
    id: screen-title
    text: My days
- takeScreenshot: MyDays-stack
- tapOn:
    id: my-days-back
- assertVisible:
    id: screen-title
    text: Today
- assertVisible:
    id: tab-today
    selected: true
