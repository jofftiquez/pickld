# M1-23: tap each main tab and check its screen title and selected state.
# Run on the iOS Simulator: maestro test apps/mobile/.maestro/tab-switch.yaml
appId: me.pickld.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000
- assertVisible:
    id: screen-title
    text: Today
- takeScreenshot: Today-tabs

# Capture opens the full-screen camera (M2-07); closing it returns to Today.
- tapOn:
    id: tab-capture
- extendedWaitUntil:
    visible:
      id: camera-screen
    timeout: 10000
- takeScreenshot: Capture-tabs
- tapOn:
    id: camera-close
- extendedWaitUntil:
    visible:
      id: tab-today
      selected: true
    timeout: 5000

- tapOn:
    id: tab-jars
- assertVisible:
    id: screen-title
    text: Jars
- assertVisible:
    id: tab-jars
    selected: true
- takeScreenshot: Jars-tabs

- tapOn:
    id: tab-my-days
- assertVisible:
    id: screen-title
    text: My days
- assertVisible:
    id: tab-my-days
    selected: true
- takeScreenshot: MyDays-tabs

- tapOn:
    id: tab-today
- assertVisible:
    id: screen-title
    text: Today
- assertVisible:
    id: tab-today
    selected: true
