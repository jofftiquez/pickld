# M2-30: offline capture loop (NFR-OFF-01, NFR-OFF-02; design: UploadStates).
# Capture offline → the tile waits for connection under the offline banner → kill the app → reopen: still
# queued → back online → the photo uploads, is checked and goes live, with no attempts used up (D-24).
#
# The Simulator shares the Mac's network and Maestro's airplane mode is Android-only, so the flow uses the
# dev-only switch pickld://dev/network?offline=1|0 (src/lib/devOffline.ts). It survives the kill and is
# ignored by release builds. Needs a dev build.
#
# Run on the iOS Simulator against the local stack:
#   maestro test --test-output-dir docs/milestones/M2 apps/mobile/.maestro/offline-loop.yaml
#   maestro test -e SLOT=ootd apps/mobile/.maestro/offline-loop.yaml
#
# Seed (supabase/seed.sql as is): signed in as dale (supabase db reset; scripts/dev-sign-in.sh →
# /dev/sign-in). Today's jar has SLOT empty (evening, ootd, whoamiwith and afternoon are). To run again:
# supabase db reset. If a run stops halfway, open pickld://dev/network?offline=0 (or erase the app's data).
appId: me.pickld.app
---
# Default SLOT here, not in env: (a flow's env: overrides `maestro test -e` in Maestro 2.12).
- evalScript: "${output.slot = (typeof SLOT !== 'undefined' && SLOT) ? SLOT : 'evening'}"
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000

# Go offline.
- openLink: pickld://dev/network?offline=1
# iOS asks before opening a custom-scheme link.
- extendedWaitUntil:
    visible: Open
    timeout: 5000
    optional: true
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 10000

# Capture SLOT with the mock camera (the steps of camera.yaml).
# The camera opens from the slot's tile on Today; the slot is fixed (no switcher).
- scrollUntilVisible:
    element:
      id: tile-${output.slot}
    direction: DOWN
    timeout: 10000
- tapOn:
    id: tile-${output.slot}
- extendedWaitUntil:
    visible:
      id: camera-mock-preview
    timeout: 10000
- tapOn:
    id: camera-shutter
# The shutter opens the editor on the queued photo (M2-12); Add to #slot saves it.
- extendedWaitUntil:
    visible:
      id: editor-screen
    timeout: 10000
# Next, then Save, in the editor's top toolbar (D-59, D-103), always on screen.
- tapOn:
    id: editor-next
- tapOn:
    id: editor-save
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 10000

# Offline: saved on the phone, waiting for connection, under the offline banner.
- extendedWaitUntil:
    visible:
      id: tile-${output.slot}
      text: '#${output.slot}, .*waiting for connection.*'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: offline-banner
      text: 'You’re offline\. .*saved on your phone.*'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: UploadStates-offline-ios

# Kill the app and reopen it, still offline: the photo is still queued.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: tile-${output.slot}
      text: '#${output.slot}, .*waiting for connection.*'
    timeout: 15000
- assertVisible:
    id: offline-banner

# Back online: it uploads on its own, is checked, and goes live.
- openLink: pickld://dev/network?offline=0
- extendedWaitUntil:
    visible: Open
    timeout: 5000
    optional: true
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: tile-${output.slot}
      text: '#${output.slot}, .*(uploading|checking|added).*'
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: offline-banner
    timeout: 30000
# Live: a filled tile reads "added" (fn:moderate auto-approves in the early version, D-22).
- extendedWaitUntil:
    visible:
      id: tile-${output.slot}
      text: '#${output.slot}, .*added.*'
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: UploadStates-online-ios
