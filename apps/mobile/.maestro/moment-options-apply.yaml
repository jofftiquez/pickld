# M2-23 (FR-CAP-10) and QA item 3 (D-54): every action applied to a live moment from the moment preview,
# checking Today after each. Visibility: Only me (D-48)
# → Edit caption (Done, then reopened to see it saved) → Edit stickers and filters (Mono) → Move to TO →
# Re-crop (flip, Save crop) → Delete (confirmed). Changes the server: run it on local Supabase only, signed in
# as a user whose open jar has FROM live and TO empty (the seeded dale@pickld.test: #morning and
# #afternoon; `pnpm db:reset` restores the seed afterwards).
#   maestro test --test-output-dir docs/milestones/M2 apps/mobile/.maestro/moment-options-apply.yaml
#   maestro test -e FROM=whereami -e TO=ootd apps/mobile/.maestro/moment-options-apply.yaml
appId: me.pickld.app
---
- evalScript: "${output.from = (typeof FROM !== 'undefined' && FROM) ? FROM : 'morning'}"
- evalScript: "${output.to = (typeof TO !== 'undefined' && TO) ? TO : 'afternoon'}"
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000

# Visibility → Only me (D-48): the radio row is checked and the tile says so.
- tapOn:
    id: tile-${output.from}
- tapOn:
    id: preview-visibility-action
- tapOn:
    id: moment-options-visibility-only_me
- extendedWaitUntil:
    visible:
      id: moment-options-visibility-only_me
      checked: true
    timeout: 10000
- tapOn:
    id: moment-options-cancel
- tapOn:
    id: preview-close
- extendedWaitUntil:
    visible:
      id: tile-${output.from}
      text: '#${output.from}, .*private.*'
    timeout: 10000

# Edit caption: saved through fn:moderate; reopening the editor shows it. The editor returns to the preview.
- tapOn:
    id: tile-${output.from}
- tapOn:
    id: preview-edit
- extendedWaitUntil:
    visible:
      id: editor-caption
    timeout: 15000
- eraseText: 160
- inputText: Coffee first
- hideKeyboard
- tapOn:
    id: editor-save
- extendedWaitUntil:
    visible:
      id: moment-preview
    timeout: 15000
- tapOn:
    id: preview-edit
- extendedWaitUntil:
    visible:
      id: editor-caption
    timeout: 15000
- assertVisible: Coffee first

# Edit stickers and filters: Mono, Done; the tile draws the filter.
- tapOn: Mono
- tapOn:
    id: editor-save
- extendedWaitUntil:
    visible:
      id: moment-preview
    timeout: 15000
- tapOn:
    id: preview-close
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: MomentOptions-edited-ios

# Move to an empty slot (under More): the photo leaves FROM and fills TO.
- tapOn:
    id: tile-${output.from}
- tapOn:
    id: preview-more
- tapOn:
    id: moment-options-move
- tapOn:
    id: moment-options-move-${output.to}
- extendedWaitUntil:
    visible:
      id: moment-preview
    timeout: 10000
- tapOn:
    id: preview-close
- extendedWaitUntil:
    visible:
      id: tile-${output.to}
      text: '#${output.to}, .*private.*'
    timeout: 10000
- assertVisible:
    id: tile-${output.from}
    text: '#${output.from}, (empty|now, tap to capture)'

# Re-crop: flip and save; the new photo replaces the old one after fn:moderate.
- tapOn:
    id: tile-${output.to}
- tapOn:
    id: preview-more
- tapOn:
    id: moment-options-recrop
- extendedWaitUntil:
    visible:
      id: crop-screen
    timeout: 15000
- tapOn:
    id: crop-flip
- tapOn:
    id: crop-done
- extendedWaitUntil:
    visible:
      id: moment-preview
    timeout: 30000
- tapOn:
    id: preview-close
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: MomentOptions-recropped-ios

# Delete (under More) asks first; confirming empties the slot. The preview moves to the next moment, or
# closes when none is left.
- tapOn:
    id: tile-${output.to}
- tapOn:
    id: preview-more
- tapOn:
    id: moment-options-delete
- tapOn:
    id: delete-moment-confirm
- runFlow:
    when:
      visible:
        id: preview-close
    commands:
      - tapOn:
          id: preview-close
- extendedWaitUntil:
    visible:
      id: tile-${output.to}
      text: '#${output.to}, (empty|now, tap to capture)'
    timeout: 10000
