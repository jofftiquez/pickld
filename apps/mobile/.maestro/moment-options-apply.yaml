# M2-23 (FR-CAP-10): every Moment option applied to a live moment, checking Today after each. Make private
# → Edit caption (Done, then reopened to see it saved) → Edit stickers and filters (Mono) → Move to TO →
# Re-crop (flip, Save crop) → Delete (confirmed). Changes the server: run it on local Supabase only, signed in
# as a user whose open jar has FROM live and TO empty (the seeded dale@pickld.test: #morning and
# #afternoon; `pnpm db:reset` restores the seed afterwards).
#   maestro test --test-output-dir docs/milestones/M2 apps/mobile/.maestro/moment-options-apply.yaml
#   maestro test -e FROM=whereami -e TO=ootd apps/mobile/.maestro/moment-options-apply.yaml
appId: me.pickld.app
---
- evalScript: "${output.from = (typeof FROM !== 'undefined' && FROM) ? FROM : 'morning'}"
- evalScript: "${output.to = (typeof TO !== 'undefined' && TO) ? TO : 'afternoon'}"
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000

# Make private: the switch flips and the tile says so.
- tapOn:
    id: tile-${output.from}
- tapOn:
    id: moment-options-private
- extendedWaitUntil:
    visible:
      id: moment-options-private
      checked: true
    timeout: 10000
- tapOn:
    id: moment-options-cancel
- extendedWaitUntil:
    visible:
      id: tile-${output.from}
      text: '#${output.from}, .*private.*'
    timeout: 10000

# Edit caption: saved through fn:moderate; reopening the editor shows it.
- tapOn:
    id: tile-${output.from}
- tapOn:
    id: moment-options-caption
- extendedWaitUntil:
    visible:
      id: editor-caption
    timeout: 15000
- eraseText: 160
- inputText: Coffee first
- hideKeyboard
- tapOn:
    id: editor-save
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- tapOn:
    id: tile-${output.from}
- tapOn:
    id: moment-options-edit
- extendedWaitUntil:
    visible:
      id: editor-caption
    timeout: 15000
- assertVisible: Coffee first

# Edit stickers and filters: Mono, Done; the tile draws the filter.
- tapOn: Mono
- tapOn:
    id: editor-save
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: MomentOptions-edited-ios

# Move to an empty slot: the photo leaves FROM and fills TO.
- tapOn:
    id: tile-${output.from}
- tapOn:
    id: moment-options-move
- tapOn:
    id: moment-options-move-${output.to}
- extendedWaitUntil:
    visible:
      id: tile-${output.to}
      text: '#${output.to}, .*private.*'
    timeout: 10000
- assertVisible:
    id: tile-${output.from}
    text: '#${output.from}, (empty|now, tap to capture)'

# Re-crop: flip and save; the new photo replaces the old one after fn:moderate.
- tapOn:
    id: tile-${output.to}
- tapOn:
    id: moment-options-recrop
- extendedWaitUntil:
    visible:
      id: crop-screen
    timeout: 15000
- tapOn:
    id: crop-flip
- swipe:
    start: 50%, 95%
    end: 50%, 80%
- tapOn:
    id: crop-done
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: MomentOptions-recropped-ios

# Delete asks first; confirming empties the slot.
- tapOn:
    id: tile-${output.to}
- tapOn:
    id: moment-options-delete
- tapOn:
    id: delete-moment-confirm
- extendedWaitUntil:
    visible:
      id: tile-${output.to}
      text: '#${output.to}, (empty|now, tap to capture)'
    timeout: 10000
