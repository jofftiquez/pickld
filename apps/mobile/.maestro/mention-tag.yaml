# FR-CAP-08: tag a mutual reader. Dale takes a photo into SLOT, adds a Mention sticker for Aya (the Mention tool
# offers only mutual readers: Aya and Mika, not Jun, who reads Dale one way), then types "@ay" in the caption and
# picks Aya from the suggestions. Saved and live, Dale's preview shows Tagged @aya. Aya is told
# ("Dale Santos tagged you in a moment"), the row opens Moment detail with the Tagged row, and Remove tag takes
# it off.
# Needs the seed data, dale signed in and SLOT empty in his open jar (default afternoon):
#   maestro test -e ANON_KEY=... apps/mobile/.maestro/mention-tag.yaml
# Ends signed in as Aya; sign Dale back in afterwards (sign-in-email.yaml).
appId: com.teamops.apps.Pickld
env:
  SLOT: afternoon
  JAR: b0000000-0000-4000-8000-000000000103
---
- launchApp:
    permissions:
      camera: allow
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000
- scrollUntilVisible:
    element:
      id: tile-${SLOT}
    direction: DOWN
    timeout: 10000
- tapOn:
    id: tile-${SLOT}
- extendedWaitUntil:
    visible:
      id: camera-shutter
    timeout: 20000
- tapOn:
    id: camera-shutter
- extendedWaitUntil:
    visible:
      id: editor-screen
    timeout: 15000
# The Mention tool: mutual readers only.
- tapOn: Mention
- extendedWaitUntil:
    visible:
      id: mention-person-aya
    timeout: 15000
- assertVisible:
    id: mention-person-mika
- assertNotVisible:
    id: mention-person-jun
- tapOn:
    id: mention-person-aya
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: MentionSticker-ios
# Caption: typing @ay suggests Aya.
- tapOn:
    id: editor-next
- tapOn:
    id: editor-caption
- inputText: lunch with @ay
- extendedWaitUntil:
    visible:
      id: editor-caption-mention-aya
    timeout: 15000
- takeScreenshot: MentionSuggest-ios
- tapOn:
    id: editor-caption-mention-aya
# The details step's return key is a ✓ (since the photo description field), which Maestro's hideKeyboard
# can't use; tapping the Caption label closes the keyboard.
- tapOn: Caption
- tapOn:
    id: editor-save
- extendedWaitUntil:
    visible:
      id: tile-${SLOT}
      text: '#${SLOT}, .*'
    timeout: 20000
# The tile fills from the queue at once; wait until the moment is on the server and live.
- extendedWaitUntil:
    notVisible:
      id: tile-${SLOT}
      text: '.*(uploading|waiting for connection|checking).*'
    timeout: 60000
# Live (fn:moderate auto-approves locally): Dale's Jar page shows the tag.
- openLink: pickld://jar/${JAR}
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- scrollUntilVisible:
    element:
      id: jar-tile-${SLOT}
    direction: DOWN
    timeout: 60000
- tapOn:
    id: jar-tile-${SLOT}
# The owner's tile opens the moment preview: the caption's @aya and the Tagged row link to Aya.
- extendedWaitUntil:
    visible: lunch with @aya
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: preview-tag-aya
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: MomentTagged-ios
# Aya's side.
- runFlow:
    file: sign-in-email.yaml
    env:
      EMAIL: aya@pickld.test
- extendedWaitUntil:
    visible: '.*, Aya.*'
    timeout: 30000
- tapOn:
    id: today-notifications
- extendedWaitUntil:
    visible: '.*Dale Santos.*tagged you in a moment.*'
    timeout: 30000
- takeScreenshot: TagNotification-ios
- tapOn: '.*Dale Santos.*tagged you in a moment.*'
- extendedWaitUntil:
    visible:
      id: moment-remove-tag
    timeout: 30000
- assertVisible:
    id: moment-tag-aya
- takeScreenshot: TaggedAsAya-ios
- tapOn:
    id: moment-remove-tag
- extendedWaitUntil:
    notVisible:
      id: moment-tag-aya
    timeout: 20000
