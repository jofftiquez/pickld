# M2-23 (FR-CAP-10) and QA item 3 (D-54, FR-JAR-02): a filled Today tile opens the moment preview (design:
# MomentPreview) → Visibility opens the Visibility page → More opens Moment options without the bar's actions
# (design: MomentOptions) → Move page → Delete asks first (Cancel keeps it) → Re-crop opens Crop on the saved
# photo (Cancel returns to the preview) → Edit opens the editor (Close changes nothing).
# Nothing is changed on the server. Run on the iOS Simulator with a dev build, signed in as a user whose
# open jar has SLOT filled with a live moment (the seeded dale@pickld.test has #whereami):
#   maestro test --test-output-dir docs/milestones/M2 apps/mobile/.maestro/moment-options.yaml
#   maestro test -e SLOT=morning apps/mobile/.maestro/moment-options.yaml
appId: me.pickld.app
---
- evalScript: "${output.slot = (typeof SLOT !== 'undefined' && SLOT) ? SLOT : 'whereami'}"
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-today
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000

- tapOn:
    id: tile-${output.slot}
- extendedWaitUntil:
    visible:
      id: moment-preview
    timeout: 10000
- assertVisible: '#${output.slot}'
- assertVisible:
    id: preview-edit
- assertVisible:
    id: preview-share
- assertVisible:
    id: preview-visibility-action
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: MomentPreview-ios

# Visibility opens straight on the Visibility page; Cancel closes it.
- tapOn:
    id: preview-visibility-action
- extendedWaitUntil:
    visible: Who can see this moment
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: MomentPreview-visibility-ios
- tapOn:
    id: moment-options-cancel

# More: Re-crop, Move and Delete; Edit and Visibility are on the bar.
- tapOn:
    id: preview-more
- extendedWaitUntil:
    visible:
      id: moment-options-delete
    timeout: 5000
- assertVisible: Re-crop
- assertVisible: Move to another moment
- assertNotVisible: Edit caption
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: MomentOptions-ios

# Move lists the jar's empty slots; Back returns.
- tapOn:
    id: moment-options-move
- assertVisible: 'Pick an empty moment in this jar for your #${output.slot} photo'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: MomentOptions-move-ios
- tapOn:
    id: moment-options-move-back

# Delete asks for confirmation; Cancel keeps the moment.
- tapOn:
    id: moment-options-delete
- extendedWaitUntil:
    visible: 'Delete your #${output.slot} photo?'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: MomentOptions-delete-ios
- tapOn:
    text: Cancel
    childOf:
      id: delete-moment-dialog
- assertNotVisible: 'Delete your #${output.slot} photo?'

# Re-crop opens Crop on the saved photo.
- tapOn:
    id: moment-options-recrop
- extendedWaitUntil:
    visible:
      id: crop-screen
    timeout: 15000
- assertVisible: '#${output.slot} · re-crop'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: Recrop-ios
# The main button is the green pill at the header's top right (D-65); no scrolling needed.
- assertVisible:
    id: crop-done
    text: Save crop
- tapOn:
    id: crop-cancel
- extendedWaitUntil:
    visible:
      id: moment-preview
    timeout: 10000

# Edit opens the editor on the uploaded moment, at the photo step (D-103).
- tapOn:
    id: preview-edit
- extendedWaitUntil:
    visible:
      id: editor-screen
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: MomentPreview-edit-ios
