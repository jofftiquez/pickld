# M3-04: the Jars tab lists followed authors' published jars with avatar rings and photo mosaics.
# Needs the seed data (dale reads mika and aya) and dale signed in:
# maestro test apps/mobile/.maestro/jars-feed.yaml
appId: me.pickld.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-jars
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: splash-overlay
    timeout: 10000
- tapOn:
    id: tab-jars
- assertVisible:
    id: screen-title
    text: Jars
- extendedWaitUntil:
    visible:
      id: feed-card-mika
    timeout: 15000
- assertVisible:
    id: feed-author-me
- assertVisible:
    id: feed-author-mika
- assertVisible:
    id: feed-card-aya
# Let the thumbnails arrive before the screenshot.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: Jars-ios
