  '@sentry/cli': false
  esbuild: false
  workerd: false
minimumReleaseAgeExclude:
  - '@expo/config-plugins@58.0.13'
  - '@expo/plist@0.10.2'
  - '@expo/require-utils@58.0.6'
  - expo-media-library@58.0.14
  - expo-sharing@58.0.23
patchedDependencies:
  '@opennextjs/aws@4.2.0': patches/@opennextjs__aws@4.2.0.patch
  react-native-screens@4.30.1: patches/react-native-screens@4.30.1.patch
