one; color: #11140d; font-size: 15px; font-weight: 600; border-bottom: 1px solid #eef0ea"><span style="flex: 1">Who can see my jars?</span><span style="color: #8b9184"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span></a><a href="#" style="display: flex; align-items: center; gap: 10px; padding: 13px 0; text-decoration: none; color: #11140d; font-size: 15px; font-weight: 600; border-bottom: 1px solid #eef0ea"><span style="flex: 1">What happens when I travel?</span><span style="color: #8b9184"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span></a><a href="#" style="display: flex; align-items: center; gap: 10px; padding: 13px 0; text-decoration: none; color: #11140d; font-size: 15px; font-weight: 600"><span style="flex: 1">How do I restore my sticker packs?</span><span style="color: #8b9184"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span></a></section>
