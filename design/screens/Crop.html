<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Pickld – Crop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#c6e08f}a:hover{color:#ffffff}
button,input{font-family:inherit}
</style>
<style>html,body{background:#d9dcd3}body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0b0d09; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #ffffff; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 24px 16px 8px; display: flex; align-items: center; justify-content: space-between">
<a href="Capture.html" style="min-width: 64px; height: 44px; display: flex; align-items: center; text-decoration: none; color: #e2e5dc; font-size: 15px; font-weight: 600">Cancel</a>
<div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
<span style="font-size: 16px; font-weight: 700">Crop photo</span>
<span style="font-size: 12px; font-weight: 500; color: #b9beb2">#afternoon · from gallery</span>
</div>
<button style="min-width: 64px; height: 44px; border: 0; background: transparent; color: #e2e5dc; font-size: 15px; font-weight: 600; text-align: right">Reset</button>
</header>

<div style="position: relative; height: 520px; margin-top: 8px; overflow: hidden">
<img src="../images/afternoon.jpg" alt="Beach with a palm tree, wider than the crop frame" style="position: absolute; top: 60px; left: -40px; width: 533px; height: 400px; object-fit: cover">
<div style="position: absolute; top: 60px; left: 45px; width: 300px; height: 400px; box-shadow: 0 0 0 600px rgba(11,13,9,0.66); outline: 1.5px solid rgba(255,255,255,0.9)">
<span aria-hidden="true" style="position: absolute; left: 33.33%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.4)"></span>
<span aria-hidden="true" style="position: absolute; left: 66.66%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.4)"></span>
<span aria-hidden="true" style="position: absolute; top: 33.33%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.4)"></span>
<span aria-hidden="true" style="position: absolute; top: 66.66%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.4)"></span>
<span aria-hidden="true" style="position: absolute; top: -3px; left: -3px; width: 24px; height: 24px; border-top: 4px solid #ffffff; border-left: 4px solid #ffffff; border-radius: 4px 0 0 0"></span>
<span aria-hidden="true" style="position: absolute; top: -3px; right: -3px; width: 24px; height: 24px; border-top: 4px solid #ffffff; border-right: 4px solid #ffffff; border-radius: 0 4px 0 0"></span>
<span aria-hidden="true" style="position: absolute; bottom: -3px; left: -3px; width: 24px; height: 24px; border-bottom: 4px solid #ffffff; border-left: 4px solid #ffffff; border-radius: 0 0 0 4px"></span>
<span aria-hidden="true" style="position: absolute; bottom: -3px; right: -3px; width: 24px; height: 24px; border-bottom: 4px solid #ffffff; border-right: 4px solid #ffffff; border-radius: 0 0 4px 0"></span>
</div>
<span style="position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: #11140d; background: #7fad33; border-radius: 999px; padding: 4px 12px; display: flex; align-items: center; gap: 5px">
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>3:4</span>
<span style="position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 500; color: #c9cec2">Drag to reposition · pinch to zoom</span>
</div>

<div style="flex: 1; background: #ffffff; color: #11140d; border-radius: 30px 30px 0 0; padding: 18px 20px 26px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#565e50" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4M8 11h6"></path></svg>
<label style="flex: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Zoom</span><input type="range" min="100" max="300" value="140" style="width: 100%; height: 44px; accent-color: #7fad33"></label>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#565e50" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4M8 11h6M11 8v6"></path></svg>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button style="height: 64px; border: 0; border-radius: 18px; background: #f0f2ec; color: #11140d; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>Rotate</button>
<button style="height: 64px; border: 0; border-radius: 18px; background: #f0f2ec; color: #11140d; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M8 7l-5 5 5 5M16 7l5 5-5 5"></path></svg>Flip</button>
<button style="height: 64px; border: 0; border-radius: 18px; background: #f0f2ec; color: #11140d; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>Fit</button>
</div>
<p style="margin: 0; font-size: 12px; color: #565e50; text-align: center">Every Pickld moment is 3:4, so your jars always line up.</p>
<div style="flex: 1"></div>
<a href="Capture.html" style="height: 54px; border-radius: 999px; background: #7fad33; color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 800; font-size: 16px; box-shadow: 0 8px 20px rgba(127,173,51,0.35)">Next: edit</a>
</div>

</div>
</body>
</html>
