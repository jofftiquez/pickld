<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #f4f5f0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #11140d; display: flex; flex-direction: column; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0"><div style="height: 150px; overflow: hidden"><img src="../images/morning.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover"></div><div style="padding: 0 20px; margin-top: -44px"><img src="../images/av_mika.jpg" alt="" style="width: 88px; height: 88px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 3px solid #ffffff; box-shadow: 0 2px 8px rgba(17,20,13,0.15)"><div style="margin-top: 10px; font-size: 22px; font-weight: 800">Mika Reyes</div><div style="font-size: 13px; color: #565e50">@mikareyes</div><div style="margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px"><img src="../images/afternoon.jpg" alt="" style="display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 16px; border-radius: 14px"><img src="../images/food.jpg" alt="" style="display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 16px; border-radius: 14px"><img src="../images/ootd.jpg" alt="" style="display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 16px; border-radius: 14px"><img src="../images/busy.jpg" alt="" style="display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 16px; border-radius: 14px"><img src="../images/morning.jpg" alt="" style="display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 16px; border-radius: 14px"><img src="../images/evening.jpg" alt="" style="display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 16px; border-radius: 14px"></div></div></div><div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(10,12,8,0.55)"></div><div role="dialog" aria-label="Report" style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-radius: 30px 30px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 8px"><span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #d5d9cf; margin-bottom: 6px"></span><div style="display: flex; gap: 8px; margin-bottom: 4px"><a href="Report.html" style="flex: 1; height: 44px; border-radius: 14px; background: #fdeceb; color: #b42318; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; font-size: 14px">Report</a><a href="Block.html" style="flex: 1; height: 44px; border-radius: 14px; background: #f0f2ec; color: #11140d; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; font-size: 14px">Block</a></div><h2 style="margin: 4px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Why are you reporting this?</h2><p style="margin: 0 0 4px; font-size: 13px; color: #565e50">Mika won’t know who reported her.</p><label style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #eef0ea; font-size: 15px; font-weight: 500"><span style="flex: 1">Nudity or sexual content</span><input type="radio" name="reason" style="width: 22px; height: 22px; accent-color: #7fad33"></label><label style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #eef0ea; font-size: 15px; font-weight: 500"><span style="flex: 1">Harassment or bullying</span><input type="radio" name="reason" checked style="width: 22px; height: 22px; accent-color: #7fad33"></label><label style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #eef0ea; font-size: 15px; font-weight: 500"><span style="flex: 1">Violence or dangerous acts</span><input type="radio" name="reason" style="width: 22px; height: 22px; accent-color: #7fad33"></label><label style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #eef0ea; font-size: 15px; font-weight: 500"><span style="flex: 1">Hate speech or symbols</span><input type="radio" name="reason" style="width: 22px; height: 22px; accent-color: #7fad33"></label><label style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #eef0ea; font-size: 15px; font-weight: 500"><span style="flex: 1">Spam or scam</span><input type="radio" name="reason" style="width: 22px; height: 22px; accent-color: #7fad33"></label><label style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #eef0ea; font-size: 15px; font-weight: 500"><span style="flex: 1">Involves someone under 13</span><input type="radio" name="reason" style="width: 22px; height: 22px; accent-color: #7fad33"></label><label style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #eef0ea; font-size: 15px; font-weight: 500"><span style="flex: 1">Something else</span><input type="radio" name="reason" style="width: 22px; height: 22px; accent-color: #7fad33"></label><div style="height: 6px"></div><a href="ReportThanks.html" style="text-decoration: none; height: 54px; border: 0; border-radius: 999px; background: #7fad33; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 800; font-size: 16px; box-shadow: 0 8px 20px rgba(127,173,51,0.35)">Submit report</a></div>
</div>
