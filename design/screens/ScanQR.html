<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #000000; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #ffffff; display: flex; flex-direction: column; overflow: hidden">
<img src="../images/whoamiwith.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(2px) brightness(0.55)"><header style="position: relative; padding: 24px 16px 0; display: flex; justify-content: space-between"><a href="Waiting.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; background: #ffffff; color: #11140d; box-shadow: 0 1px 3px rgba(17,20,13,0.10); background: rgba(10,12,8,0.45); color: #ffffff; box-shadow: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span role="button" aria-label="Flashlight" style="width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; background: #ffffff; color: #11140d; box-shadow: 0 1px 3px rgba(17,20,13,0.10); background: rgba(10,12,8,0.45); color: #ffffff; box-shadow: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 13.5h6L10 21l9-11h-6z"></path></svg></span></header><div style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px 28px 36px; gap: 18px; color: #ffffff; text-align: center"><h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; text-shadow: 0 1px 4px rgba(0,0,0,0.4)">Scan an invite</h1><p style="margin: -8px 0 0; font-size: 14px; color: #e2e5dc; text-shadow: 0 1px 4px rgba(0,0,0,0.4)">Point at a friend's Pickld QR code.</p><div style="position: relative; width: 250px; height: 250px; margin-top: 20px"><span style="position: absolute; width: 38px; height: 38px; border-color: #ffffff; border-style: solid; left: 0; top: 0; border-width: 4px 0 0 4px; border-radius: 22px 0 0 0"></span><span style="position: absolute; width: 38px; height: 38px; border-color: #ffffff; border-style: solid; right: 0; top: 0; border-width: 4px 4px 0 0; border-radius: 0 22px 0 0"></span><span style="position: absolute; width: 38px; height: 38px; border-color: #ffffff; border-style: solid; left: 0; bottom: 0; border-width: 0 0 4px 4px; border-radius: 0 0 0 22px"></span><span style="position: absolute; width: 38px; height: 38px; border-color: #ffffff; border-style: solid; right: 0; bottom: 0; border-width: 0 4px 4px 0; border-radius: 0 0 22px 0"></span></div><span role="alert" style="margin-top: 8px; background: rgba(10,12,8,0.6); border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 700">That's not a Pickld invite</span><div style="flex: 1"></div><a href="Waiting.html" style="color: #ffffff; font-size: 15px; font-weight: 700; padding: 10px">Type the code instead</a></div>
