<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Pickld – Edit photo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3f6510}a:hover{color:#2c470a}
button,input,textarea{font-family:inherit}
</style>
<style>html,body{background:#d9dcd3}body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<!-- Edit photo (D-103): step 1 of the editor, Instagram style. iOS 26 and later draw the toolbar and its round button as Liquid Glass (D-57, D-80); this file shows the frosted blur used below iOS 26 and with Reduce Transparency on. Next opens Edit details; nothing is saved yet. Crop isn't here (D-106). -->
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0b0d09; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #11140d; display: flex; flex-direction: column; overflow: hidden">
<div role="toolbar" style="position: absolute; top: 0; left: 0; right: 0; z-index: 2; padding: 54px 16px 8px; background: rgba(10,12,8,0.55); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: flex; align-items: center; gap: 8px">
<div aria-hidden="true" style="position: absolute; top: 14px; left: 24px; right: 24px; display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; color: #ffffff"><span>9:41</span><span>●●● ▮</span></div>
<a href="Main.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(10,12,8,0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
<div style="flex: 1; display: flex; justify-content: center"><div style="display: flex; flex-direction: column; align-items: center; gap: 1px; background: rgba(10,12,8,0.5); border-radius: 18px; padding: 7px 16px">
<span style="font-size: 15px; font-weight: 700; color: #ffffff">#afternoon</span>
<span style="font-size: 11px; font-weight: 500; color: #e2e5dc">Today · 2:14 PM</span>
</div></div>
<a href="EditDetails.html" style="height: 36px; border-radius: 999px; background: #7fad33; color: #ffffff; padding: 0 12px; display: flex; align-items: center; text-decoration: none; font-weight: 700; font-size: 13px">Next</a>
</div>

<div style="height: 114px; flex-shrink: 0"></div>
<div style="position: relative; align-self: center; width: 352px; height: 469px; flex-shrink: 0; border-radius: 0 0 32px 32px; overflow: hidden; background: #2a2d26">
<img src="../images/food.jpg" alt="Bowl of sinigang on a table" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div style="position: absolute; top: 70px; left: 22px; background: #ffffff; color: #11140d; border-radius: 20px 20px 20px 6px; padding: 10px 16px; font-size: 17px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,0.22); transform: rotate(-2deg)">Lunch break, finally!</div>
<div style="position: absolute; bottom: 34px; right: 22px; background: #7fad33; color: #11140d; border-radius: 12px; padding: 7px 13px; font-weight: 800; font-size: 13px; letter-spacing: 0.06em; transform: rotate(-5deg); box-shadow: 0 6px 16px rgba(0,0,0,0.2)">LIVE · LAUGH · EAT</div>
</div>
<div style="flex: 1; margin-top: -10px; background: #ffffff; border-radius: 30px 30px 0 0; padding: 18px 0 26px; display: flex; flex-direction: column; gap: 14px">
<div role="tablist" aria-label="Edit tools" style="margin: 0 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #f0f2ec; border-radius: 999px; padding: 4px">
<button role="tab" aria-selected="true" style="height: 38px; border: 0; border-radius: 999px; background: #11140d; color: #ffffff; font-weight: 700; font-size: 13px">Filters</button>
<a href="Stickers.html" role="tab" aria-selected="false" style="text-decoration: none; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #4b5245; font-weight: 600; font-size: 13px">Stickers</a>
<a href="Bubble.html" role="tab" aria-selected="false" style="text-decoration: none; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #4b5245; font-weight: 600; font-size: 13px">Bubble</a>
<a href="Text.html" role="tab" aria-selected="false" style="text-decoration: none; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #4b5245; font-weight: 600; font-size: 13px">Text</a>
</div>
<div style="display: flex; gap: 12px; padding: 4px 0 0 25px; overflow: hidden">
<button aria-pressed="true" style="flex-shrink: 0; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #11140d; font-size: 12px; font-weight: 700">
<span aria-hidden="true" style="position: relative; width: 58px; height: 58px; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 3px #ffffff, 0 0 0 5px #7fad33"><img src="../images/food.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; filter: none"></span>Original</button>
<button aria-pressed="false" style="flex-shrink: 0; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #11140d; font-size: 12px; font-weight: 500">
<span aria-hidden="true" style="position: relative; width: 58px; height: 58px; border-radius: 18px; overflow: hidden; box-shadow: none"><img src="../images/food.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; filter: saturate(1.3) hue-rotate(-12deg) brightness(1.05)"></span>Kalamansi</button>
<button aria-pressed="false" style="flex-shrink: 0; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #11140d; font-size: 12px; font-weight: 500">
<span aria-hidden="true" style="position: relative; width: 58px; height: 58px; border-radius: 18px; overflow: hidden; box-shadow: none"><img src="../images/food.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; filter: sepia(0.45) saturate(1.2)"></span>Merienda</button>
<button aria-pressed="false" style="flex-shrink: 0; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #11140d; font-size: 12px; font-weight: 500">
<span aria-hidden="true" style="position: relative; width: 58px; height: 58px; border-radius: 18px; overflow: hidden; box-shadow: none"><img src="../images/food.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.1)"></span>Mono</button>
<button aria-pressed="false" style="flex-shrink: 0; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #11140d; font-size: 12px; font-weight: 500">
<span aria-hidden="true" style="position: relative; width: 58px; height: 58px; border-radius: 18px; overflow: hidden; box-shadow: none"><img src="../images/food.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; filter: hue-rotate(20deg) saturate(0.8) brightness(0.9)"></span>Dusk</button>
</div>
<div style="padding: 0 20px"><button style="height: 44px; border: 1.5px solid #dfe2d8; border-radius: 999px; background: #ffffff; color: #11140d; padding: 0 20px; font-weight: 700; font-size: 14px">Undo</button></div>
</div>
</div>
</body>
</html>
