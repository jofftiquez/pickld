name: deploy-production

# Deploys pickld.me to production by hand (Actions → deploy-production → Run workflow). Every credential lives on
# the GitHub environment `production`. Until SUPABASE_PROJECT_REF is set there, only the web site ships, as
# "coming soon": marketing pages, the waitlist closed, shared links 404. docs/runbooks/staging.md, "Web site".
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WEB_URL: ${{ vars.WEB_URL || 'https://pickld.me' }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      WAITLIST_OPEN: ${{ vars.WAITLIST_OPEN }}
      APP_STORE_URL: ${{ vars.APP_STORE_URL }}
      PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      WAITLIST_SECRET: ${{ secrets.WAITLIST_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Web site (Cloudflare Worker)
        run: scripts/deploy/web.sh production
      - name: pickld.me answers over HTTPS
        run: |
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$WEB_URL/" || true)"
            [ "$code" = 200 ] && { echo "ok    $WEB_URL → 200"; exit 0; }
            sleep 10
          done
          echo "FAIL  $WEB_URL → $code (the custom domain can take a few minutes after the first deploy)"; exit 1
