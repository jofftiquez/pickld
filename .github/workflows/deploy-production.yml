name: deploy-production

# Deploys production by hand (Actions → deploy-production → Run workflow). Every credential lives on the GitHub
# environment `production`. Until SUPABASE_PROJECT_REF is set there, only the web site ships, as "coming soon":
# marketing pages, the waitlist closed, shared links 404. With it, the database, Edge Functions and Auth deploy
# first, and the photo bucket and Worker once the R2 keys are set. docs/runbooks/production.md.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      # The install step below is the only install: without this, a `pnpm run`/`pnpm exec` in a later step that
      # thinks node_modules is stale reinstalls, and pnpm 12's hoisted install can fail on a staging folder.
      pnpm_config_verify_deps_before_run: false
      # Variables (not secret)
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WEB_URL: ${{ vars.WEB_URL || 'https://pickld.me' }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      WAITLIST_OPEN: ${{ vars.WAITLIST_OPEN }}
      APP_STORE_URL: ${{ vars.APP_STORE_URL }}
      PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      APPLE_SIGN_IN_KEY_ID: ${{ vars.APPLE_SIGN_IN_KEY_ID }}
      # Secrets
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
      REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
      REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      WAITLIST_SECRET: ${{ secrets.WAITLIST_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APPLE_SIGN_IN_KEY: ${{ secrets.APPLE_SIGN_IN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        if: env.SUPABASE_PROJECT_REF != ''
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Database, Edge Functions, photo Worker, sticker art
        if: env.SUPABASE_PROJECT_REF != ''
        run: scripts/deploy/deploy.sh production
      - name: Secrets, cron jobs, Auth (templates, SMTP, Apple)
        if: env.SUPABASE_PROJECT_REF != ''
        run: scripts/deploy/configure.sh production
      - name: Web site and moderation console (Cloudflare Workers)
        run: scripts/deploy/web.sh production
      - name: Smoke test
        if: env.SUPABASE_PROJECT_REF != ''
        run: scripts/deploy/smoke.sh production
      - name: pickld.me answers over HTTPS
        run: |
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$WEB_URL/" || true)"
            [ "$code" = 200 ] && { echo "ok    $WEB_URL → 200"; exit 0; }
            sleep 10
          done
          echo "FAIL  $WEB_URL → $code (the custom domain can take a few minutes after the first deploy)"; exit 1
