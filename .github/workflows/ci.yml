name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Start local Supabase
        run: pnpm db:start
      - name: Apply migrations and seed
        run: pnpm db:reset
      - name: Generated database types are current
        run: pnpm db:types:check
      - name: Database tests (pgTAP)
        run: pnpm db:test
      - name: Edge Function tests (against local Supabase)
        run: pnpm fn:test
      - name: Secret scan (source and exported bundle)
        run: |
          pnpm --filter @pickld/mobile scan:secrets
          pnpm --filter @pickld/mobile scan:bundle
