name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Chromium for the web page tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Unit tests
        run: pnpm test
      - name: Start local Supabase
        run: pnpm db:start
      - name: Bucket settings for the local Edge runtime
        # The console tests upload sticker art through fn:sticker-studio, which writes to the bucket. Locally
        # these come from the git-ignored supabase/functions/.env; the Edge runtime reads it at start, so the
        # stack restarts once it's written.
        run: |
          eval "$(pnpm exec supabase status -o env 2>/dev/null | grep -E '^(STORAGE_S3_URL|S3_PROTOCOL_[A-Z_]+)=')"
          {
            echo "S3_ENDPOINT=$STORAGE_S3_URL"
            echo "S3_REGION=$S3_PROTOCOL_REGION"
            echo "S3_BUCKET=photos"
            echo "S3_ACCESS_KEY_ID=$S3_PROTOCOL_ACCESS_KEY_ID"
            echo "S3_SECRET_ACCESS_KEY=$S3_PROTOCOL_ACCESS_KEY_SECRET"
            echo "S3_INTERNAL_ENDPOINT=${STORAGE_S3_URL/127.0.0.1/host.docker.internal}"
          } > supabase/functions/.env
          pnpm exec supabase stop
          pnpm db:start
      - name: Apply migrations and seed
        run: pnpm db:reset
      - name: Generated database types are current
        run: pnpm db:types:check
      - name: Database tests (pgTAP)
        run: pnpm db:test
      - name: Edge Function tests (against local Supabase)
        run: pnpm fn:test
      - name: Moderation console tests (Chromium, against local Supabase)
        run: pnpm --filter @pickld/mod test:e2e
      - name: Secret scan (source and exported bundle)
        run: |
          pnpm --filter @pickld/mobile scan:secrets
          pnpm --filter @pickld/mobile scan:bundle
          node apps/mobile/scripts/scan-secrets.mjs apps/web/src apps/web/.env.example apps/web/.next/static apps/mod/src apps/mod/.env.example apps/mod/.next/static
